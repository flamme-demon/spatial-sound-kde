<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <style type="text/css" id="current-color-scheme">
    .ColorScheme-Text { color: #232629; }
  </style>
  <!--
    Source rayonnante au centre, deux arcs concentriques autour : le champ
    sonore qui entoure l'auditeur, dans le vocabulaire visuel d'un systeme
    solaire vu a plat.

    Deux choix contre-intuitifs, valides par rasterisation a 22 px (la taille
    reelle dans le panneau) :

    1. Les arcs sont BRISES, pas fermes. Deux cercles concentriques complets
       autour d'une forme centrale se lisent comme un oeil, le centre faisant
       pupille. Les ouvertures suppriment cette lecture. Ne pas les fermer.
    2. Le centre est FESTONNE et plein. Un disque lisse redevient une pupille ;
       les lobes le font lire comme une source qui rayonne.

    La reference d'origine ajoutait des planetes cerclees et un soleil evide :
    testes, ils tournent en bouillie des 22 px. Ne pas les reintroduire sans
    reverifier a cette taille.

    Trace monochrome, utilise en masque (isMask) : Plasma le teinte avec la
    couleur de texte du panneau, donc il suit les themes clair et sombre.
  -->
  <g fill="none" stroke="currentColor" class="ColorScheme-Text" stroke-width="1.5" stroke-linecap="round">
    <path d="M 5.02 8.21 A 6.6 6.6 0 1 1 9.29 17.38"/>
    <path d="M 19.52 14.97 A 9.4 9.4 0 1 1 13.43 1.92"/>
  </g>
